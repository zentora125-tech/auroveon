<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auroveon | Building Digital Experiences That Feel Alive</title>
    <meta
      name="description"
      content="Auroveon crafts immersive products, AI systems, and next-gen web experiences for ambitious brands."
    />
    <meta name="theme-color" content="#080A08" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-base: #080a08;
        --bg-2: #0c0f0c;
        --bg-3: #111411;
        --bg-4: #161a16;
        --accent: #39ff14;
        --accent-dim: #2bc410;
        --accent-glow: rgba(57, 255, 20, 0.16);
        --accent-glow-strong: rgba(57, 255, 20, 0.36);
        --text-primary: #f0f5f0;
        --text-secondary: #7a8a7a;
        --text-muted: #4a574a;
        --border: rgba(57, 255, 20, 0.1);
        --border-strong: rgba(57, 255, 20, 0.24);
        --glass: rgba(12, 15, 12, 0.58);
        --glass-2: rgba(17, 20, 17, 0.82);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: auto;
      }

      body {
        background:
          radial-gradient(
            circle at top,
            rgba(57, 255, 20, 0.09),
            transparent 28%
          ),
          linear-gradient(180deg, #080a08 0%, #090c09 48%, #070907 100%);
        color: var(--text-primary);
        font-family: "Inter", sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      @media (min-width: 1024px) {
        body {
          cursor: none;
        }
      }

      canvas {
        display: block;
      }

      .display-font {
        font-family: "Poppins", sans-serif;
      }

      .mono-font {
        font-family: "JetBrains Mono", monospace;
      }

      .brand-logo {
        display: block;
        width: auto;
        height: 100%;
        object-fit: contain;
      }

      .brand-logo-link {
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
      }

      .brand-logo-nav {
        height: 68px;
      }

      .brand-logo-footer {
        height: 72px;
        max-width: min(100%, 240px);
      }

      .brand-logo-inline {
        height: 26px;
      }

      .site-shell {
        width: min(1380px, calc(100% - 1.5rem));
        margin: 0 auto;
      }

      @media (min-width: 1024px) {
        .site-shell {
          width: min(1380px, calc(100% - 4rem));
        }
      }

      .noise-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        opacity: 0.034;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 240px 240px;
      }

      .cursor-dot,
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 90;
        opacity: 0;
      }

      .cursor-dot {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        background: var(--accent);
        box-shadow: 0 0 22px rgba(57, 255, 20, 0.65);
        mix-blend-mode: screen;
      }

      .cursor-ring {
        width: 54px;
        height: 54px;
        border-radius: 9999px;
        border: 1px solid rgba(57, 255, 20, 0.22);
        background: radial-gradient(
          circle,
          rgba(57, 255, 20, 0.12),
          transparent 72%
        );
        transition:
          width 0.25s ease,
          height 0.25s ease,
          border-color 0.25s ease,
          background 0.25s ease;
      }

      .cursor-ring.is-hovering {
        width: 76px;
        height: 76px;
        border-color: rgba(57, 255, 20, 0.48);
        background: radial-gradient(
          circle,
          rgba(57, 255, 20, 0.2),
          transparent 76%
        );
      }

      @media (max-width: 1023px) {
        .cursor-dot,
        .cursor-ring {
          display: none;
        }
      }

      .glass-panel {
        background: linear-gradient(
          180deg,
          rgba(18, 23, 18, 0.8),
          rgba(10, 12, 10, 0.58)
        );
        border: 1px solid var(--border);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow:
          0 18px 60px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .soft-divider {
        background: linear-gradient(
          90deg,
          transparent,
          rgba(57, 255, 20, 0.28),
          transparent
        );
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        color: var(--accent);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .section-kicker {
        font-family: "Poppins", sans-serif;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      .hero-image {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            100deg,
            rgba(8, 10, 8, 0.94) 16%,
            rgba(8, 10, 8, 0.74) 52%,
            rgba(8, 10, 8, 0.9) 100%
          ),
          radial-gradient(
            circle at 78% 30%,
            rgba(57, 255, 20, 0.14),
            transparent 24%
          ),
          url("https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1800&q=80")
            center/cover no-repeat;
        transform: scale(1.04);
        filter: saturate(0.5) contrast(1.08) brightness(0.42);
      }

      .hero-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(57, 255, 20, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(57, 255, 20, 0.035) 1px, transparent 1px);
        background-size: 74px 74px;
        mask-image: radial-gradient(
          circle at 58% 38%,
          black 0%,
          black 42%,
          transparent 88%
        );
        -webkit-mask-image: radial-gradient(
          circle at 58% 38%,
          black 0%,
          black 42%,
          transparent 88%
        );
      }

      .hero-spotlight {
        position: absolute;
        border-radius: 9999px;
        filter: blur(130px);
        pointer-events: none;
      }

      .hero-stage {
        position: relative;
        min-height: min(610px, calc(100svh - 15.5rem));
        border-radius: 34px;
        overflow: hidden;
        isolation: isolate;
      }

      .hero-stage-raised {
        transform: translateY(-0.75rem);
      }

      @media (min-width: 1024px) {
        .hero-stage-raised {
          transform: translateY(-2rem);
        }
      }

      @media (max-width: 1023px) {
        .hero-stage {
          min-height: 430px;
        }

        .hero-stage-raised {
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .hero-stage {
          min-height: 380px;
          border-radius: 28px;
        }
      }

      .hero-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 50% 40%,
            rgba(57, 255, 20, 0.1),
            transparent 28%
          ),
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%),
          linear-gradient(
            140deg,
            rgba(57, 255, 20, 0.05),
            rgba(9, 12, 9, 0.16) 30%,
            rgba(9, 12, 9, 0.92) 88%
          );
        z-index: 0;
      }

      .hero-stage::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 33px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        pointer-events: none;
      }

      .mesh-glow {
        position: absolute;
        inset: auto;
        width: 220px;
        height: 220px;
        border-radius: 9999px;
        background: radial-gradient(
          circle,
          rgba(57, 255, 20, 0.2),
          transparent 68%
        );
        filter: blur(36px);
      }

      .marquee {
        overflow: hidden;
        position: relative;
      }

      .marquee-track {
        display: flex;
        width: max-content;
        animation: marquee-left 28s linear infinite;
      }

      @keyframes marquee-left {
        0% {
          transform: translateX(0%);
        }

        100% {
          transform: translateX(-50%);
        }
      }

      .service-card,
      .case-card,
      .proof-card,
      .workflow-card,
      .metric-card,
      .contact-card {
        position: relative;
        overflow: hidden;
      }

      .service-card::before,
      .case-card::before,
      .proof-card::before,
      .workflow-card::before,
      .metric-card::before,
      .contact-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 24%),
          radial-gradient(
            circle at top right,
            rgba(57, 255, 20, 0.08),
            transparent 24%
          );
        pointer-events: none;
      }

      .service-card:hover,
      .case-card:hover,
      .proof-card:hover,
      .workflow-card:hover,
      .metric-card:hover,
      .contact-card:hover {
        border-color: var(--border-strong);
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.38),
          0 0 45px rgba(57, 255, 20, 0.1);
      }

      .headline-italics {
        font-family: "Poppins", sans-serif;
        font-style: italic;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
        overflow: visible;
        width: fit-content;
      }

      .shine-heading,
      .shine-heading .split-inner {
        color: transparent;
        -webkit-text-fill-color: transparent;
        display: inline;
        overflow: visible;
        background-image: linear-gradient(
          100deg,
          rgba(240, 245, 240, 0.98) 0%,
          rgba(240, 245, 240, 0.98) 34%,
          rgba(57, 255, 20, 0.92) 50%,
          rgba(240, 245, 240, 0.98) 66%,
          rgba(240, 245, 240, 0.98) 100%
        );
        background-size: 220% 100%;
        background-position: 140% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: heading-shine-green 4.8s linear infinite;
      }

      .shine-heading-accent,
      .shine-heading-accent .split-inner {
        color: transparent;
        -webkit-text-fill-color: transparent;
        display: inline;
        overflow: visible;
        background-image: linear-gradient(
          100deg,
          rgba(57, 255, 20, 1) 0%,
          rgba(57, 255, 20, 1) 36%,
          rgba(255, 255, 255, 0.98) 50%,
          rgba(57, 255, 20, 1) 64%,
          rgba(57, 255, 20, 1) 100%
        );
        background-size: 220% 100%;
        background-position: 140% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        animation: heading-shine-white 4.8s linear infinite;
      }

      .shine-heading .split-word,
      .shine-heading-accent .split-word {
        padding-bottom: 0.08em;
        margin-bottom: -0.08em;
      }

      @keyframes text-shine {
        0%   { background-position: -200% center; }
        100% { background-position:  200% center; }
      }

      .shine-text {
        display: inline;
        overflow: visible;
      }

      .shine-text .split-word {
        display: inline;
        overflow: visible;
        padding-right: 0.18em;
      }

      .shine-text .split-inner {
        display: inline-block;
        overflow: visible;
        padding-left: 0.08em;
        margin-left: -0.08em;
        padding-right: 0.12em;
        margin-right: -0.12em;
        padding-bottom: 0.15em;
        margin-bottom: -0.15em;
        background: linear-gradient(
          90deg,
          #ffffff 0%,
          #ffffff 35%,
          #b9ffb0 44%,
          #eaffea 50%,
          #b9ffb0 56%,
          #ffffff 65%,
          #ffffff 100%
        );
        background-size: 200% auto;
        background-position: -200% center;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: text-shine 4s linear infinite;
      }

      .shine-text-accent {
        display: inline;
        overflow: visible;
      }

      .shine-text-accent .split-word {
        display: inline;
        overflow: visible;
        padding-right: 0.18em;
      }

      .shine-text-accent .split-inner {
        display: inline-block;
        overflow: visible;
        padding-left: 0.08em;
        margin-left: -0.08em;
        padding-right: 0.12em;
        margin-right: -0.12em;
        padding-bottom: 0.15em;
        margin-bottom: -0.15em;
        background: linear-gradient(
          90deg,
          #39ff14 0%,
          #39ff14 35%,
          #ccffcc 44%,
          #efffef 50%,
          #ccffcc 56%,
          #39ff14 65%,
          #39ff14 100%
        );
        background-size: 200% auto;
        background-position: -200% center;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: text-shine 4s linear infinite;
      }

      @keyframes heading-shine-green {
        0% {
          background-position: 140% 50%;
        }

        100% {
          background-position: -40% 50%;
        }
      }

      @keyframes heading-shine-white {
        0% {
          background-position: 140% 50%;
        }

        100% {
          background-position: -40% 50%;
        }
      }

      .split-word {
        display: inline;
        overflow: visible;
        line-height: inherit;
        padding-right: 0.18em;
      }

      .section-frame {
        position: relative;
      }

      .section-frame::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(57, 255, 20, 0.08),
          transparent
        );
      }

      .sticky-progress {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 100%;
        background: rgba(57, 255, 20, 0.08);
        overflow: hidden;
        border-radius: 9999px;
      }

      .sticky-progress > span {
        display: block;
        width: 100%;
        height: 0%;
        background: linear-gradient(
          180deg,
          rgba(57, 255, 20, 0.18),
          var(--accent)
        );
        border-radius: inherit;
      }

      .footer-link,
      .nav-link {
        color: var(--text-secondary);
        transition: color 0.24s ease;
      }

      .nav-scrolled {
        background: rgba(8, 10, 8, 0.86);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }

      .nav-link:hover,
      .footer-link:hover {
        color: var(--text-primary);
      }

      .nav-link.active { color: var(--accent); }
      /* Services Dropdown */
      .nav-dropdown-wrap { position: relative; }
      .nav-dropdown-wrap:hover .nav-dropdown { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); pointer-events: auto; }
      .nav-dropdown {
        position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%) translateY(-8px);
        min-width: 200px; background: rgba(10,13,10,0.98);
        border: 1px solid var(--border); border-radius: 20px;
        padding: 10px; opacity: 0; visibility: hidden;
        transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
        backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(57,255,20,0.06);
        z-index: 100;
      }
      .nav-dropdown a { display: block; padding: 9px 14px; border-radius: 12px; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; transition: color 0.2s ease, background 0.2s ease; text-decoration: none; }
      .nav-dropdown a:hover { color: var(--accent); background: rgba(57,255,20,0.06); }
      .nav-dropdown-btn { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); transition: color 0.24s ease; font-size: 1rem; font-weight: 500; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
      .nav-dropdown-wrap:hover .nav-dropdown-btn { color: var(--text-primary); }
      .nav-dropdown-btn svg { transition: transform 0.22s ease; flex-shrink: 0; }
      .nav-dropdown-wrap:hover .nav-dropdown-btn svg { transform: rotate(180deg); }
      .mob-dropdown { display: none; flex-direction: column; gap: 4px; padding: 8px 0; }
      .mob-dropdown.open { display: flex; }
      .mob-dropdown a { display: block; padding: 10px 18px; border-radius: 12px; color: var(--text-secondary); font-size: 1rem; font-weight: 500; transition: color 0.2s ease, background 0.2s ease; text-decoration: none; }
      .mob-dropdown a:hover { color: var(--accent); background: rgba(57,255,20,0.06); }

      .footer-contact-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-secondary);
      }

      .footer-contact-value {
        margin-top: 4px;
        color: #ffffff;
        font-size: 0.95rem;
      }

      .footer-contact-link {
        color: #ffffff;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer-contact-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .footer-legal-link {
        color: var(--text-secondary);
        transition: color 0.24s ease;
      }

      .footer-legal-link:hover {
        color: var(--accent);
      }

      .footer-social-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }

      .footer-social-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border: 1px solid #1a3a1a;
        border-radius: 9999px;
        background: #111;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .footer-social-link svg {
        width: 18px;
        height: 18px;
        fill: #aaaaaa;
        transition: fill 0.2s ease;
      }

      .footer-social-link:hover {
        border-color: #00ff88;
        transform: translateY(-1px);
      }

      .footer-social-link:hover svg {
        fill: #00ff88;
      }

      .whatsapp-fab {
        position: fixed;
        bottom: 28px;
        right: 8px;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border: none;
        border-radius: 50%;
        background: #25d366;
        box-shadow: 0 4px 20px rgba(37, 211, 102, 0.45);
        transition: all 0.25s ease;
      }

      .whatsapp-fab:hover {
        transform: scale(1.1);
      }

      .section-reveal {
        opacity: 0;
        transform: translateY(60px);
      }

      .mini-label {
        color: var(--text-muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
      }

      .orbital-line {
        position: absolute;
        border: 1px solid rgba(57, 255, 20, 0.12);
        border-radius: 9999px;
      }

      .testimonial-quote-mark {
        font-family: "Poppins", sans-serif;
        line-height: 1;
        color: rgba(57, 255, 20, 0.12);
      }

      .testimonial-rail {
        position: relative;
      }

      .testimonial-mini {
        transition:
          transform 0.35s ease,
          border-color 0.35s ease,
          opacity 0.35s ease;
      }

      .testimonial-mini.is-active {
        transform: translateY(-6px);
        border-color: var(--border-strong);
        opacity: 1;
      }

      .blog-feature-grid {
        background:
          linear-gradient(180deg, rgba(57, 255, 20, 0.05), transparent 34%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.03), transparent 42%);
      }

      .blog-line {
        background: linear-gradient(
          180deg,
          rgba(57, 255, 20, 0.24),
          rgba(57, 255, 20, 0)
        );
      }

      .case-media {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        border: 1px solid rgba(57, 255, 20, 0.08);
        background: rgba(7, 10, 7, 0.68);
      }

      .case-media::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(8, 10, 8, 0.02), rgba(8, 10, 8, 0.26)),
          radial-gradient(
            circle at top right,
            rgba(57, 255, 20, 0.12),
            transparent 28%
          );
        pointer-events: none;
      }

      .case-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.02);
        transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .case-card:hover .case-media img {
        transform: scale(1.1);
      }

      .case-media-mini {
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(57, 255, 20, 0.08);
        background: rgba(255, 255, 255, 0.04);
      }

      .case-media-mini img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.03);
        transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .case-card:hover .case-media-mini img {
        transform: scale(1.08);
      }

      .process-outer {
        min-height: 340vh;
        position: relative;
      }

      .process-inner {
        position: sticky;
        top: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        overflow: hidden;
      }

      .process-pill {
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 0.7rem 1rem;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.02);
      }

        transition:

      function CursorSystem() {
        const dotRef = useRef(null);
        const ringRef = useRef(null);

        useEffect(() => {
          if (window.innerWidth < 1024) return undefined;

          const dot = dotRef.current;
          const ring = ringRef.current;
          if (!dot || !ring || !window.gsap) return undefined;

          const dotX = gsap.quickTo(dot, "left", {
            duration: 0.14,
            ease: "power3",
          });
          const dotY = gsap.quickTo(dot, "top", {
            duration: 0.14,
            ease: "power3",
          });
          const ringX = gsap.quickTo(ring, "left", {
            duration: 0.3,
            ease: "power3",
          });
          const ringY = gsap.quickTo(ring, "top", {
            duration: 0.3,
            ease: "power3",
          });

          gsap.set([dot, ring], { opacity: 1 });

          const move = (event) => {
            dotX(event.clientX);
            dotY(event.clientY);
            ringX(event.clientX);
            ringY(event.clientY);
          };

          const hoverables = document.querySelectorAll(
            "a, button, [data-hover]",
          );
          const onEnter = () => ring.classList.add("is-hovering");
          const onLeave = () => ring.classList.remove("is-hovering");

          hoverables.forEach((node) => {
            node.addEventListener("mouseenter", onEnter);
            node.addEventListener("mouseleave", onLeave);
          });

          window.addEventListener("mousemove", move);

          return () => {
            window.removeEventListener("mousemove", move);
            hoverables.forEach((node) => {
              node.removeEventListener("mouseenter", onEnter);
              node.removeEventListener("mouseleave", onLeave);
            });
          };
        }, []);

        return (
          <>
            <div ref={dotRef} className="cursor-dot" />
            <div ref={ringRef} className="cursor-ring" />
          </>
        );
      }

      function useAgencyCore(stageRef) {
        useEffect(() => {
          const stage = stageRef.current;
          if (!stage || !window.THREE || !window.gsap || !window.ScrollTrigger)
            return undefined;

          const scene = new THREE.Scene();
          const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance",
          });

          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
          renderer.outputEncoding = THREE.sRGBEncoding;
          renderer.domElement.style.position = "absolute";
          renderer.domElement.style.inset = "0";
          renderer.domElement.style.zIndex = "1";
          stage.appendChild(renderer.domElement);

          const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
          camera.position.set(0, 0.2, 8.8);

          const ambient = new THREE.AmbientLight(0xffffff, 0.45);
          const key = new THREE.PointLight(0x39ff14, 2.1, 30, 2);
          key.position.set(3.5, 2.4, 4.6);
          const rim = new THREE.PointLight(0x9ce88d, 1.4, 40, 2);
          rim.position.set(-4.4, -2.5, -2.5);
          scene.add(ambient, key, rim);

          const root = new THREE.Group();
          scene.add(root);

          const orb = new THREE.Mesh(
            new THREE.IcosahedronGeometry(1.62, 8),
            new THREE.MeshPhysicalMaterial({
              color: 0x8aff73,
              emissive: 0x163e0e,
              emissiveIntensity: 1.25,
              transparent: true,
              opacity: 0.78,
              roughness: 0.12,
              metalness: 0.08,
              transmission: 0.74,
              thickness: 1,
              clearcoat: 1,
              clearcoatRoughness: 0.1,
            }),
          );

          const shell = new THREE.LineSegments(
            new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.96, 2)),
            new THREE.LineBasicMaterial({
              color: 0xc4ffb7,
              transparent: true,
              opacity: 0.18,
            }),
          );

          const ringA = new THREE.Mesh(
            new THREE.TorusGeometry(2.45, 0.05, 20, 140),
            new THREE.MeshStandardMaterial({
              color: 0x91ff7a,
              emissive: 0x39ff14,
              emissiveIntensity: 0.65,
              transparent: true,
              opacity: 0.22,
              roughness: 0.18,
              metalness: 0.2,
            }),
          );
          ringA.rotation.x = 1.18;

          const ringB = ringA.clone();
          ringB.rotation.set(0.32, 1.26, 0.1);
          ringB.scale.set(0.78, 0.78, 0.78);

          const knot = new THREE.Mesh(
            new THREE.TorusKnotGeometry(1.08, 0.16, 160, 28, 2, 5),
            new THREE.MeshPhysicalMaterial({
              color: 0x39ff14,
              emissive: 0x225d12,
              emissiveIntensity: 0.95,
              transparent: true,
              opacity: 0.35,
              roughness: 0.25,
              metalness: 0.42,
            }),
          );
          knot.scale.set(0.9, 0.9, 0.9);

          const particleCount = 1200;
          const positions = new Float32Array(particleCount * 3);
          for (let i = 0; i < particleCount; i += 1) {
            const radius = 2.1 + Math.random() * 1.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = radius * Math.cos(phi);
            positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
          }

          const particles = new THREE.Points(
            new THREE.BufferGeometry(),
            new THREE.PointsMaterial({
              color: 0xb7ffab,
              transparent: true,
              opacity: 0.78,
              size: 0.032,
              sizeAttenuation: true,
            }),
          );
          particles.geometry.setAttribute(
            "position",
            new THREE.BufferAttribute(positions, 3),
          );

          const uiPlanes = new THREE.Group();
          [
            { x: -2.3, y: 1.4, z: -0.5, w: 1.8, h: 0.8 },
            { x: 2.25, y: -1.15, z: 0.5, w: 1.45, h: 0.65 },
            { x: -1.7, y: -2.1, z: -0.2, w: 1.15, h: 0.5 },
          ].forEach((plane) => {
            const mesh = new THREE.Mesh(
              new THREE.PlaneGeometry(plane.w, plane.h),
              new THREE.MeshBasicMaterial({
                color: 0x8eff7b,
                transparent: true,
                opacity: 0.08,
                side: THREE.DoubleSide,
              }),
            );
            mesh.position.set(plane.x, plane.y, plane.z);
            uiPlanes.add(mesh);
          });

          root.add(orb, shell, ringA, ringB, knot, particles, uiPlanes);

          let frameId = null;
          const mouse = { x: 0, y: 0 };
          const target = { x: 0, y: 0 };

          const resize = () => {
            const bounds = stage.getBoundingClientRect();
            renderer.setSize(bounds.width, bounds.height, false);
            camera.aspect = bounds.width / bounds.height;
            camera.updateProjectionMatrix();
          };

          resize();

          const onMove = (event) => {
            const bounds = stage.getBoundingClientRect();
            target.x =
              ((event.clientX - bounds.left) / bounds.width - 0.5) * 0.9;
            target.y =
              ((event.clientY - bounds.top) / bounds.height - 0.5) * 0.9;
          };

          const tick = () => {
            mouse.x += (target.x - mouse.x) * 0.06;
            mouse.y += (target.y - mouse.y) * 0.06;

            root.rotation.y += 0.0036;
            root.rotation.x += 0.0014;
            root.rotation.y += mouse.x * 0.012;
            root.rotation.x += mouse.y * 0.009;

            orb.rotation.y -= 0.004;
            shell.rotation.x += 0.003;
            knot.rotation.x -= 0.008;
            knot.rotation.y += 0.012;
            ringA.rotation.z += 0.004;
            ringB.rotation.z -= 0.003;
            particles.rotation.y -= 0.0009;
            particles.rotation.x += 0.0007;
            uiPlanes.rotation.y += 0.0025;

            renderer.render(scene, camera);
            frameId = requestAnimationFrame(tick);
          };

          frameId = requestAnimationFrame(tick);
          stage.addEventListener("mousemove", onMove);
          window.addEventListener("resize", resize);

          const timeline = gsap.timeline({
            scrollTrigger: {
              trigger: "#home",
              start: "top top",
              end: "bottom top",
              scrub: 1.2,
            },
          });

          timeline
            .to(root.rotation, { x: 0.9, y: 2.3, ease: "none" }, 0)
            .to(root.position, { y: -0.65, z: -0.8, ease: "none" }, 0)
            .to(knot.scale, { x: 1.22, y: 1.22, z: 1.22, ease: "none" }, 0)
            .to(camera.position, { z: 7.5, ease: "none" }, 0);

          const visibility = () => {
            if (document.hidden && frameId) {
              cancelAnimationFrame(frameId);
              frameId = null;
            } else if (!document.hidden && !frameId) {
              frameId = requestAnimationFrame(tick);
            }
          };

          document.addEventListener("visibilitychange", visibility);

          return () => {
            document.removeEventListener("visibilitychange", visibility);
            stage.removeEventListener("mousemove", onMove);
            window.removeEventListener("resize", resize);
            if (frameId) cancelAnimationFrame(frameId);
            timeline.scrollTrigger?.kill();
            timeline.kill();
            renderer.dispose();
            scene.traverse((child) => {
              if (child.geometry) child.geometry.dispose();
              if (child.material) {
                if (Array.isArray(child.material)) {
                  child.material.forEach((material) => material.dispose());
                } else {
                  child.material.dispose();
                }
              }
            });
            stage.removeChild(renderer.domElement);
          };
        }, [stageRef]);
      }

      function App() {
        const appRef = useRef(null);

        useEffect(() => {
          if (!window.gsap || !window.ScrollTrigger || !window.Lenis)
            return undefined;

          gsap.registerPlugin(ScrollTrigger);

          const lenis = new Lenis({
            duration: 1.2,
            smoothWheel: true,
            lerp: 0.08,
          });

          let rafId = null;
          const raf = (time) => {
            lenis.raf(time);
            rafId = requestAnimationFrame(raf);
          };
          rafId = requestAnimationFrame(raf);

          const anchors = document.querySelectorAll('a[href^="#"]');
          const onAnchorClick = (event) => {
            const href = event.currentTarget.getAttribute("href");
            if (!href || href === "#") return;
            const target = document.querySelector(href);
            if (!target) return;
            event.preventDefault();
            lenis.scrollTo(target, { offset: -72, duration: 1.2 });
          };

          anchors.forEach((anchor) =>
            anchor.addEventListener("click", onAnchorClick),
          );

          const ctx = gsap.context(() => {
            gsap.from(".split-inner", {
              yPercent: 110,
              opacity: 0,
              duration: 1.2,
              stagger: 0.05,
              ease: "power4.out",
              delay: 0.15,
            });

            gsap.utils.toArray("[data-reveal]").forEach((element) => {
              if (
                element.matches(
                  ".service-card, .case-card, .testimonial-mini, .blog-card-advanced",
                )
              ) {
                return;
              }
              gsap.fromTo(
                element,
                { y: 54, opacity: 0 },
                {
                  y: 0,
                  opacity: 1,
                  duration: 1.05,
                  ease: "power3.out",
                  delay: Number(element.dataset.delay || 0),
                  scrollTrigger: {
                    trigger: element,
                    start: "top 88%",
                  },
                },
              );
            });

            gsap.to(".parallax-orb", {
              yPercent: -14,
              ease: "none",
              scrollTrigger: {
                trigger: "#home",
                start: "top top",
                end: "bottom top",
                scrub: 1.2,
              },
            });

            gsap.to(".hero-copy", {
              yPercent: 10,
              ease: "none",
              scrollTrigger: {
                trigger: "#home",
                start: "top top",
                end: "bottom top",
                scrub: 1.1,
              },
            });

            gsap.to(".hero-stage-raised", {
              yPercent: -4,
              rotateX: 1.4,
              ease: "none",
              transformOrigin: "50% 50%",
              scrollTrigger: {
                trigger: "#home",
                start: "top top",
                end: "bottom top",
                scrub: 1.15,
              },
            });

            gsap.utils.toArray(".service-card").forEach((card, index) => {
              gsap.fromTo(
                card,
                {
                  x: index % 2 === 0 ? -26 : 26,
                  y: 44,
                  opacity: 0,
                },
                {
                  x: 0,
                  y: 0,
                  opacity: 1,
                  duration: 1,
                  ease: "power3.out",
                  scrollTrigger: {
                    trigger: card,
                    start: "top 88%",
                  },
                },
              );
            });

            gsap.utils.toArray(".case-card").forEach((card, index) => {
              gsap.fromTo(
                card,
                { y: 60, opacity: 0, rotateY: index % 2 === 0 ? -6 : 6 },
                {
                  y: 0,
                  opacity: 1,
                  rotateY: 0,
                  duration: 1.1,
                  ease: "power3.out",
                  scrollTrigger: {
                    trigger: card,
                    start: "top 85%",
                  },
                },
              );
            });

            gsap.to(".testimonial-shell", {
              yPercent: -6,
              ease: "none",
              scrollTrigger: {
                trigger: "#testimonials",
                start: "top bottom",
                end: "bottom top",
                scrub: 1.1,
              },
            });

            gsap.utils.toArray(".testimonial-mini").forEach((card, index) => {
              gsap.fromTo(
                card,
                { x: -24, opacity: 0 },
                {
                  x: 0,
                  opacity: 1,
                  duration: 0.8,
                  ease: "power3.out",
                  scrollTrigger: {
                    trigger: card,
                    start: "top 88%",
                  },
                  delay: index * 0.04,
                },
              );
            });

            gsap.utils.toArray(".blog-card-advanced").forEach((card, index) => {
              gsap.fromTo(
                card,
                { y: 70, opacity: 0, rotateX: 8 },
                {
                  y: 0,
                  opacity: 1,
                  rotateX: 0,
                  duration: 1,
                  ease: "power3.out",
                  scrollTrigger: {
                    trigger: card,
                    start: "top 88%",
                  },
                  delay: index * 0.06,
                },
              );

              gsap.to(card, {
                xPercent: index === 1 ? 3 : index === 2 ? -3 : 0,
                ease: "none",
                scrollTrigger: {
                  trigger: card,
                  start: "top bottom",
                  end: "bottom top",
                  scrub: 1.1,
                },
              });
            });

            gsap.to(".blog-sticky", {
              yPercent: -8,
              ease: "none",
              scrollTrigger: {
                trigger: "#blog",
                start: "top bottom",
                end: "bottom top",
                scrub: 1.15,
              },
            });

            const progress = document.getElementById("story-progress-bar");
            const storyNumber = document.getElementById("story-number");
            const storyOverline = document.getElementById("story-overline");
            const storyHeadline = document.getElementById("story-headline");
            const storyDesc = document.getElementById("story-desc");
            const storyPills = document.getElementById("story-pills");
            const storyCards = gsap.utils.toArray(".process-preview-card");

            if (
              progress &&
              storyNumber &&
              storyOverline &&
              storyHeadline &&
              storyDesc &&
              storyPills &&
              storyCards.length
            ) {
              let activeStoryIndex = 0;

              const setStoryStep = (index) => {
                if (index === activeStoryIndex) return;
                activeStoryIndex = index;
                const item = workflowData[index];

                storyCards.forEach((card, cardIndex) => {
                  card.classList.toggle("is-active", cardIndex === index);
                  card.style.opacity = cardIndex === index ? "1" : "0.72";
                });

                gsap.to(
                  [
                    storyNumber,
                    storyOverline,
                    storyHeadline,
                    storyDesc,
                    storyPills,
                  ],
                  {
                    opacity: 0,
                    y: 18,
                    duration: 0.16,
                    stagger: 0.025,
                    onComplete: () => {
                      storyNumber.textContent = item.step;
                      storyOverline.textContent = item.label;
                      storyHeadline.textContent = item.title;
                      storyDesc.textContent = item.text;
                      storyPills.innerHTML = item.pills
                        .map(
                          (pill) => `<span class="process-pill">${pill}</span>`,
                        )
                        .join("");
                      gsap.fromTo(
                        [
                          storyNumber,
                          storyOverline,
                          storyHeadline,
                          storyDesc,
                          storyPills,
                        ],
                        { opacity: 0, y: 18 },
                        {
                          opacity: 1,
                          y: 0,
                          duration: 0.34,
                          stagger: 0.04,
                          ease: "power3.out",
                        },
                      );
                    },
                  },
                );
              };

              storyCards.forEach((card, index) => {
                card.style.opacity = index === 0 ? "1" : "0.72";
                card.addEventListener("mouseenter", () => setStoryStep(index));
              });

              gsap.to(progress, {
                height: "100%",
                ease: "none",
                scrollTrigger: {
                  trigger: "#story",
                  start: "top top",
                  end: "bottom bottom",
                  scrub: 1,
                  onUpdate: (self) => {
                    const nextIndex = Math.min(
                      workflowData.length - 1,
                      Math.floor(self.progress * workflowData.length),
                    );
                    setStoryStep(nextIndex);
                  },
                },
              });
            }
          }, appRef.current);

          const onLenisScroll = () => ScrollTrigger.update();
          lenis.on("scroll", onLenisScroll);

          return () => {
            lenis.off("scroll", onLenisScroll);
            anchors.forEach((anchor) =>
              anchor.removeEventListener("click", onAnchorClick),
            );
            ctx.revert();
            if (rafId) cancelAnimationFrame(rafId);
            lenis.destroy();
          };
        }, []);

        return (
          <div ref={appRef}>
            <div className="noise-overlay" />
            <CursorSystem />
            <Navbar />
            <main>
              <HeroSection />
              <ProofStrip />
              <ServicesSection />
              <StorySection />
              <WorkSection />
              <MetricsSection />
              <TestimonialSection />
              <BlogSection />
              <ContactSection />
            </main>
            <Footer />
            <a
              href="https://wa.me/923353213863"
              target="_blank"
              rel="noreferrer"
              aria-label="Chat with us on WhatsApp"
              className="whatsapp-fab"
            >
              <svg
                viewBox="0 0 24 24"
                fill="white"
                width="28"
                height="28"
